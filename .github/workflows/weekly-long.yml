name: StoryFacts Weekly Long (Sunday)

on:
  # Superseded while the Roblox Studio visual system is being validated.
  workflow_dispatch:

jobs:
  long:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libcairo2 libpango-1.0-0 libpangocairo-1.0-0
      - name: Python deps
        run: pip install -r requirements.txt
      - name: Compile + schedule
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_CLIENT_SECRET_B64: ${{ secrets.YOUTUBE_CLIENT_SECRET_B64 }}
          YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
          YT_PUBLISH_PRIVACY: ${{ secrets.YT_PUBLISH_PRIVACY }}
          YT_MADE_FOR_KIDS: ${{ secrets.YT_MADE_FOR_KIDS }}
        run: python -m src.run_long
