name: Daily self analysis

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Dependencies
        run: |
          pip install -r requirements.txt
          pip install yt-dlp
      - name: Scan competitors and our own uploads
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python -m src.self_improve
      - name: Save learnings
        run: |
          git config user.name "storyfacts-bot"
          git config user.email "bot@users.noreply.github.com"
          git add config/topics.json data/performance.json || true
          git commit -m "self analysis $(date -u +%F)" || true
          git push || true
